name: Build Algeria offline map

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool build-essential libsqlite3-dev zlib1g-dev git
          osmium --version

      - name: Run self-tests
        run: python3 -m unittest discover -s tests -v

      - name: Build tippecanoe
        run: |
          git clone --depth 1 https://github.com/felt/tippecanoe.git
          make -j"$(nproc)" -C tippecanoe
          ./tippecanoe/tippecanoe --version

      - name: Download Geofabrik Algeria extract
        run: |
          mkdir -p work out
          curl --fail --location --retry 5 --retry-delay 3 \
            --output work/algeria.osm.pbf \
            https://download.geofabrik.de/africa/algeria-latest.osm.pbf
          ls -l work/algeria.osm.pbf

      - name: Extract roads
        run: |
          osmium tags-filter --overwrite --output work/roads.osm.pbf work/algeria.osm.pbf \
            w/highway=motorway,motorway_link,trunk,trunk_link,primary,primary_link,secondary,secondary_link,tertiary,tertiary_link,unclassified,unclassified_link,residential,residential_link
          osmium export --overwrite --geometry-types=linestring \
            --output-format geojsonseq --output work/roads.geojsonseq work/roads.osm.pbf
          ls -l work/roads.geojsonseq
          head -c 500 work/roads.geojsonseq | cat -v

      - name: Extract place names
        run: |
          osmium tags-filter --overwrite --output work/places.osm.pbf work/algeria.osm.pbf \
            n/place=city,town,village,hamlet,suburb
          osmium export --overwrite --geometry-types=point \
            --output-format geojsonseq --output work/places.geojsonseq work/places.osm.pbf
          ls -l work/places.geojsonseq
          head -c 500 work/places.geojsonseq | cat -v

      - name: Extract borders and coastline
        run: |
          osmium tags-filter --overwrite --output work/borders.osm.pbf work/algeria.osm.pbf \
            w/boundary=administrative
          osmium export --overwrite --geometry-types=linestring \
            --output-format geojsonseq --output work/borders.geojsonseq work/borders.osm.pbf
          osmium tags-filter --overwrite --output work/coast.osm.pbf work/algeria.osm.pbf \
            w/natural=coastline
          osmium export --overwrite --geometry-types=linestring \
            --output-format geojsonseq --output work/coast.geojsonseq work/coast.osm.pbf
          ls -l work/borders.geojsonseq work/coast.geojsonseq

      - name: Prepare layers
        run: |
          python3 tools/prepare_layers.py \
            --roads-in work/roads.geojsonseq --roads-out work/roads.tiles.geojsonseq \
            --places-in work/places.geojsonseq --places-out work/places.tiles.geojsonseq \
            --borders-in work/borders.geojsonseq --borders-out work/borders.tiles.geojsonseq \
            --coast-in work/coast.geojsonseq --coast-out work/coast.tiles.geojsonseq

      - name: Build search index
        run: python3 tools/build_search_index.py --input work/places.geojsonseq --output out/places-index.json

      - name: Build vector tiles
        run: |
          layers=(-L roads:work/roads.tiles.geojsonseq -L places:work/places.tiles.geojsonseq)
          for name in borders coast; do
            if [ -s "work/$name.tiles.geojsonseq" ]; then
              layers+=(-L "$name:work/$name.tiles.geojsonseq")
            fi
          done
          ./tippecanoe/tippecanoe --force \
            --output out/algeria-map.mbtiles \
            --name "Algeria roads, places and borders" \
            --attribution "© OpenStreetMap contributors" \
            --minimum-zoom=4 --maximum-zoom=14 \
            --no-feature-limit --no-tile-size-limit \
            "${layers[@]}"
          ls -l out/algeria-map.mbtiles

      - name: Inspect result
        shell: bash
        run: |
          python3 tools/inspect_mbtiles.py out/algeria-map.mbtiles | tee out/report.txt
          { echo '```'; cat out/report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish map to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete map-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create map-latest --repo "$GITHUB_REPOSITORY" \
            --title "Carte Algérie (routes et lieux)" \
            --notes "Générée par le workflow Build Algeria offline map, exécution ${{ github.run_number }}." \
            out/algeria-map.mbtiles out/places-index.json out/report.txt

      - name: Upload map
        uses: actions/upload-artifact@v4
        with:
          name: algeria-map
          path: |
            out/algeria-map.mbtiles
            out/places-index.json
            out/report.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
