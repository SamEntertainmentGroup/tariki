name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      with_map:
        description: "Inclure la carte (≈100 Mo). À cocher pour la première installation ou pour mettre à jour la carte."
        type: boolean
        default: false

permissions:
  contents: read

env:
  ALERTS_URL: https://jarti.app/wp-admin/admin-ajax.php

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run self-tests
        run: python3 -m unittest discover -s tests -v

      - name: Check alerts server URL
        run: |
          case "$ALERTS_URL" in
            https://*) ;;
            *) echo "ALERTS_URL doit commencer par https://"; exit 1 ;;
          esac

      - name: Download map from release
        if: ${{ inputs.with_map }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p android/app/src/main/assets
          gh release download map-latest --repo "$GITHUB_REPOSITORY" \
            --pattern algeria-map.mbtiles \
            --dir android/app/src/main/assets
          ls -l android/app/src/main/assets

      - name: Check map file
        if: ${{ inputs.with_map }}
        shell: bash
        run: |
          python3 tools/inspect_mbtiles.py android/app/src/main/assets/algeria-map.mbtiles | tee map-report.txt

      - name: Download label fonts
        shell: bash
        run: |
          python3 tools/fetch_glyphs.py --output android/app/src/main/assets/glyphs | tee glyph-report.txt
          {
            echo '```'
            if [ -f map-report.txt ]; then cat map-report.txt; echo; fi
            cat glyph-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tariki.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/tariki.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Clé de signature fixe : les mises à jour par-dessus l'appli installée fonctionneront."
          else
            echo "::warning::Secrets KEYSTORE_BASE64 / KEYSTORE_PASSWORD absents : cet APK ne pourra pas se mettre à jour par-dessus une version déjà installée."
          fi

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace -PalertsUrl="$ALERTS_URL" -PversionCodeOverride="$GITHUB_RUN_NUMBER"

      - name: Check APK content
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          entries="assets/style.json assets/glyphs/NotoSans-Regular/0-255.pbf"
          if [ "${{ inputs.with_map }}" = "true" ]; then entries="$entries assets/algeria-map.mbtiles"; fi
          for entry in $entries; do
            unzip -l "$APK" | grep -q "$entry" || { echo "Manquant dans l'APK : $entry"; exit 1; }
          done
          echo "Contenu de l'APK vérifié"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.with_map && 'dz-carte-apk-avec-carte' || 'dz-carte-apk-sans-carte' }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
